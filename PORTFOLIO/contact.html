<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">PORTFOLIO</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="contact-section">
            <h1>Contact Form</h1>
            <form>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="abd@gmail.com">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="Let's build something together..."></textarea>
                </div>
                <button type="button">Send Message</button>
            </form>

            <div class="social-links">
                <a href="mailto:as5342@srmist.edu.in" title="Email Me">
                    <i class="fa-solid fa-envelope"></i>
                </a>
                <a href="https://linkedin.com/in/Amritanshu" target="_blank" title="LinkedIn">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
                <a href="https://github.com/Amritanshu-dev" target="_blank" title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
            </div>
        </section>
    </main>
</body>
